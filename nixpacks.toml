[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip", "gcc", "libffi", "openssl"]

[phases.install]
cmds = [
  "npm install",
  "python3 -m pip install --upgrade pip setuptools wheel",
  "python3 -m pip install -r backend/requirements.txt"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "bash start.sh"
